name: Deploy to todobichig.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-regru
  cancel-in-progress: true

jobs:
  ftp:
    name: Upload to Reg.ru
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Если FTPS не подключится, в секретах ничего не меняйте —
          # временно замените protocol: ftp
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.github/**/*
            **/_gh-check/**
            **/.gitignore
            **/README.md
            **/.nojekyll
