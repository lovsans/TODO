<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <script>
        (function () {
            try {
                var s = null;
                try { s = localStorage.getItem('todo-theme'); } catch (e) {}
                var t = (s === 'dark' || s === 'light') ? s
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        })();
    </script>
    <title>Страница не найдена — Тодо Бичик</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0e6f68" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/icons/icon-192.png">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="legal-page">
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">
                <img class="logo-icon" src="/img/icons/logo-192.png" width="44" height="44" alt="" aria-hidden="true">
                <div class="logo-text">
                    <p class="logo-name">Тодо Бичик</p>
                    <span class="logo-sub">Страница не найдена</span>
                </div>
            </a>
        </div>
    </header>
    <main class="container legal-wrap">
        <p class="legal-kicker">Ошибка 404</p>
        <h1>Такой страницы нет</h1>
        <p>Проверьте адрес или вернитесь на главную — самоучитель открывается оттуда целиком.</p>
        <p><a href="/">На главную</a></p>
    </main>
</body>
</html>
